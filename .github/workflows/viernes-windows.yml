name: Viernes Windows installer

# Builds the Viernes desktop installer (.exe) for 64-bit Windows and
# publishes it as a GitHub release. Runs on every push to main and can
# also be started by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: viernes-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use npm 11
        run: npm install --global npm@11.19.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Download Ollama sidecar
        shell: bash
        run: |
          cd frontend/src-tauri/scripts && chmod +x download-ollama.sh
          ./download-ollama.sh x86_64-pc-windows-msvc

      # Everything below makes the installer self-contained: users need no
      # Git, Rust, Visual Studio Build Tools or a separate uv install.
      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build the Rust extension wheel (Python 3.12)
        shell: bash
        run: |
          uv python install 3.12
          uvx maturin build --release \
            -m rust/crates/openjarvis-python/Cargo.toml \
            -i "$(uv python find 3.12)" -o build/wheels

      - name: Assemble the bundled backend
        shell: bash
        run: |
          WHEEL=$(ls build/wheels/openjarvis_rust-*-cp312-*win_amd64.whl)
          uv run --no-project --python 3.12 \
            python scripts/viernes/build_backend_bundle.py build/viernes-backend "$WHEEL" 3.12
          mkdir -p build/bin
          cp "$(command -v uv).exe" build/bin/uv.exe 2>/dev/null || cp "$(command -v uv)" build/bin/uv.exe

      - name: Smoke-test the bundled backend
        shell: bash
        working-directory: build/viernes-backend
        run: |
          # Hide cargo so the test proves no Rust toolchain is needed.
          export PATH="$(echo "$PATH" | tr ':' '\n' | grep -vi cargo | paste -sd:)"
          ../bin/uv.exe sync --extra desktop --extra inference-cloud --extra inference-google --group desktop-native
          ../bin/uv.exe run python -c "import openjarvis_rust; print('openjarvis_rust OK')"
          ../bin/uv.exe run jarvis --version
          rm -rf .venv

      - name: Write release config
        shell: bash
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "VIERNES_VERSION=$VERSION" >> "$GITHUB_ENV"
          cat > frontend/src-tauri/tauri.release.conf.json <<JSON
          {
            "version": "$VERSION",
            "bundle": {
              "externalBin": ["binaries/ollama"],
              "resources": {
                "../../build/viernes-backend/": "src/",
                "../../build/bin/": "bin/"
              }
            }
          }
          JSON

      - name: Build and publish installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          tauriScript: npx tauri
          tagName: viernes-v${{ env.VIERNES_VERSION }}
          releaseName: Viernes ${{ env.VIERNES_VERSION }}
          releaseBody: Instalador de Viernes para Windows (64 bits). Descarga el archivo que termina en -setup.exe.
          releaseDraft: false
          prerelease: false
          args: --bundles nsis --config src-tauri/tauri.release.conf.json
