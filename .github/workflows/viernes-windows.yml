name: Viernes Windows installer

# Builds the Viernes desktop installer (.exe) for 64-bit Windows and
# publishes it as a GitHub release. Runs on every push to main and can
# also be started by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: viernes-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use npm 11
        run: npm install --global npm@11.19.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Download Ollama sidecar
        shell: bash
        run: |
          cd frontend/src-tauri/scripts && chmod +x download-ollama.sh
          ./download-ollama.sh x86_64-pc-windows-msvc

      - name: Write release config
        shell: bash
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "VIERNES_VERSION=$VERSION" >> "$GITHUB_ENV"
          printf '{"version":"%s","bundle":{"externalBin":["binaries/ollama"]}}' "$VERSION" \
            > frontend/src-tauri/tauri.release.conf.json

      - name: Build and publish installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          tauriScript: npx tauri
          tagName: viernes-v${{ env.VIERNES_VERSION }}
          releaseName: Viernes ${{ env.VIERNES_VERSION }}
          releaseBody: Instalador de Viernes para Windows (64 bits). Descarga el archivo que termina en -setup.exe.
          releaseDraft: false
          prerelease: false
          args: --bundles nsis --config src-tauri/tauri.release.conf.json
